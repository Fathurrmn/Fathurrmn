<svg width="900" height="110" viewBox="0 0 900 110" xmlns="http://www.w3.org/2000/svg" shape-rendering="crispEdges">
  <!-- pixel-banded bright blue sky -->
  <rect x="0" y="0"  width="900" height="26" fill="#5fb8f0"/>
  <rect x="0" y="26" width="900" height="26" fill="#7cc6f4"/>
  <rect x="0" y="52" width="900" height="26" fill="#9dd6f7"/>
  <rect x="0" y="78" width="900" height="17" fill="#c3e8fb"/>

  <!-- drifting clouds -->
  <g fill="#ffffff" opacity="0.95">
    <g>
      <animateTransform attributeName="transform" type="translate" values="0,0;16,0;0,0" dur="8s" repeatCount="indefinite"/>
      <rect x="120" y="18" width="14" height="6"/><rect x="134" y="15" width="14" height="6"/><rect x="148" y="18" width="14" height="6"/><rect x="126" y="24" width="34" height="4"/>
    </g>
    <g>
      <animateTransform attributeName="transform" type="translate" values="0,0;-18,0;0,0" dur="10s" repeatCount="indefinite"/>
      <rect x="700" y="12" width="12" height="6"/><rect x="712" y="9" width="12" height="6"/><rect x="724" y="12" width="12" height="6"/><rect x="706" y="18" width="28" height="4"/>
    </g>
  </g>

  <!-- distant green hill silhouette -->
  <polygon points="0,95 0,70 100,45 220,75 340,55 460,80 580,50 700,78 820,58 900,75 900,95" fill="#6fae5a"/>

  <!-- grass foreground -->
  <rect x="0" y="95" width="900" height="15" fill="#4f8f3d"/>

  <!-- pixel butterfly, flies across in steps with a bobbing altitude -->
  <g>
    <animateMotion
      path="M -30 55 C 150 25, 300 70, 450 40 S 750 25, 930 50"
      dur="10s"
      calcMode="discrete"
      keyPoints="0;0.04;0.08;0.12;0.16;0.2;0.24;0.28;0.32;0.36;0.4;0.44;0.48;0.52;0.56;0.6;0.64;0.68;0.72;0.76;0.8;0.84;0.88;0.92;0.96;1"
      keyTimes="0;0.04;0.08;0.12;0.16;0.2;0.24;0.28;0.32;0.36;0.4;0.44;0.48;0.52;0.56;0.6;0.64;0.68;0.72;0.76;0.8;0.84;0.88;0.92;0.96;1"
      repeatCount="indefinite"/>

    <!-- body -->
    <rect x="-2" y="-10" width="4" height="20" fill="#2b2b3d"/>

    <!-- wings frame A: open -->
    <g>
      <animate attributeName="opacity" values="1;0" calcMode="discrete" dur="0.3s" repeatCount="indefinite"/>
      <rect x="-22" y="-14" width="8" height="8" fill="#ff8fb1"/>
      <rect x="-14" y="-10" width="8" height="8" fill="#ff8fb1"/>
      <rect x="-18" y="-4" width="8" height="8" fill="#ffb1c8"/>
      <rect x="-10" y="0" width="6" height="6" fill="#ffb1c8"/>
      <rect x="14" y="-14" width="8" height="8" fill="#ff8fb1"/>
      <rect x="6" y="-10" width="8" height="8" fill="#ff8fb1"/>
      <rect x="10" y="-4" width="8" height="8" fill="#ffb1c8"/>
      <rect x="4" y="0" width="6" height="6" fill="#ffb1c8"/>
    </g>
    <!-- wings frame B: half-closed -->
    <g>
      <animate attributeName="opacity" values="0;1" calcMode="discrete" dur="0.3s" repeatCount="indefinite"/>
      <rect x="-12" y="-10" width="6" height="8" fill="#ff8fb1"/>
      <rect x="-8" y="-6" width="6" height="8" fill="#ff8fb1"/>
      <rect x="-10" y="0" width="5" height="6" fill="#ffb1c8"/>
      <rect x="6" y="-10" width="6" height="8" fill="#ff8fb1"/>
      <rect x="2" y="-6" width="6" height="8" fill="#ff8fb1"/>
      <rect x="5" y="0" width="5" height="6" fill="#ffb1c8"/>
    </g>
  </g>
</svg>
